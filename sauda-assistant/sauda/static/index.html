<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sauda Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout: conversation column with cards inline; basket as a side panel on wide screens, a bottom sheet on phones. */
:root {
  --bg: #f2f4f0; --surface: #ffffff; --raised: #f8faf7; --fg: #16201a; --muted: #5b6960; --line: #dbe1da;
  --accent: #23664a; --accent-ink: #ffffff; --accent-soft: #e0eee6; --citrus: #a85a12; --warn: #a3392b; --ok: #2f7a3e;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Noto Naskh Arabic", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101512; --surface: #18201b; --raised: #1d2620; --fg: #e4ebe6; --muted: #98a69d; --line: #2b352f;
  --accent: #5fbb8a; --accent-ink: #0c1510; --accent-soft: #1e3128; --citrus: #e29a52; --warn: #f0826f; --ok: #77c98a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101512; --surface: #18201b; --raised: #1d2620; --fg: #e4ebe6; --muted: #98a69d; --line: #2b352f;
  --accent: #5fbb8a; --accent-ink: #0c1510; --accent-soft: #1e3128; --citrus: #e29a52; --warn: #f0826f; --ok: #77c98a; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: minmax(0, 1fr); height: 100%; }
@media (max-width: 900px) { .app { grid-template-columns: 1fr; } }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
header { display: flex; align-items: center; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface); }
header h1 { font: 700 20px/1.1 var(--display); margin: 0; }
header .store { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
header .spacer { flex: 1; }
#basketBtn { display: none; white-space: nowrap; flex: none; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 999px; padding: 6px 12px; font-weight: 600; }
@media (max-width: 900px) { #basketBtn { display: inline-block; } }
#log { flex: 1; overflow-y: auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: min(640px, 88%); padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg[dir="rtl"] { font-family: "Noto Naskh Arabic", var(--body); font-size: 16px; line-height: 1.9; }
.status { align-self: flex-start; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .3; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .status::before { animation: none; } }
.error { align-self: flex-start; color: var(--warn); border: 1px solid var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.block { align-self: stretch; display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
.block h3 { margin: 0; font: 600 13px var(--body); color: var(--muted); letter-spacing: .02em; }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.card.chosen { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ref { position: absolute; top: 8px; left: 8px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px;
  font: 600 12px var(--mono); padding: 1px 8px; }
.badge { position: absolute; top: 8px; right: 8px; background: var(--citrus); color: #fff; font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 6px; }
.thumb { aspect-ratio: 1; max-width: 100%; background: #fff; }
.thumb img, .mini img { width: 100%; height: 100%; object-fit: contain; display: block; }
.ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font: 700 26px var(--display); }
.body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.name { font-size: 13.5px; line-height: 1.3; }
.meta { font-size: 12px; color: var(--muted); }
.price { font: 500 14px var(--mono); margin-top: auto; padding-top: 4px; }
.low { font-size: 12px; color: var(--citrus); }
.add { width: 100%; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); padding: 7px; font-weight: 600; margin-top: 6px; }
.stepper { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--accent); border-radius: 8px; margin-top: 6px; }
.stepper button { background: transparent; border: 0; color: var(--accent); font-weight: 700; font-size: 16px; padding: 4px 12px; }
.stepper span { font: 500 14px var(--mono); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.lines { display: flex; flex-direction: column; gap: 8px; }
.line { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.mini { width: 36px; height: 36px; border-radius: 6px; overflow: hidden; background: #fff; border: 1px solid var(--line); }
.mini .ph { font-size: 12px; }
.line .what { min-width: 0; }
.line .what .name { overflow-wrap: anywhere; }
.amt { font: 500 14px var(--mono); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sub { color: var(--citrus); font-size: 12px; }
.total { display: flex; justify-content: space-between; font-weight: 600; border-top: 1px dashed var(--line); padding-top: 8px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); }
.bar.over > i { background: var(--warn); }
.budget { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.missing { font-size: 13px; color: var(--muted); }
.wide { border: 0; border-radius: 9px; background: var(--accent); color: var(--accent-ink); padding: 9px 14px; font-weight: 600; align-self: flex-start; }
.wide:disabled { opacity: .5; cursor: default; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13.5px; min-width: 420px; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--fg); }
.chip:hover { border-color: var(--accent); }
form { display: flex; gap: 8px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  border-top: 1px solid var(--line); background: var(--surface); }
#input { flex: 1; min-width: 0; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 15px var(--body); }
#send { border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); padding: 0 18px; font-weight: 600; }
#send:disabled { opacity: .5; }
aside { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
aside h2 { font: 700 17px var(--display); margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
aside h2 button { display: none; background: transparent; border: 0; color: var(--muted); font-size: 22px; line-height: 1; }
#basketLines { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; }
#basketLines .stepper { width: 112px; margin-top: 4px; }
#basketLines .stepper button { padding: 1px 10px; }
#basketLines .line { align-items: start; }
#basketFoot { padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.empty { color: var(--muted); text-align: center; padding: 30px 0; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; z-index: 20; }
@media (max-width: 900px) {
  aside { position: fixed; inset: auto 0 0 0; max-height: 75%; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; z-index: 10;
    transform: translateY(105%); transition: transform .2s; box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
  aside.open { transform: none; }
  aside h2 button { display: block; }
}
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <header>
      <h1>Sauda</h1>
      <span class="store" id="store">Connecting…</span>
      <span class="spacer"></span>
      <button id="basketBtn" type="button">Basket · <span id="basketCount">0</span></button>
    </header>
    <div id="log" aria-live="polite">
      <div class="msg bot" dir="auto">Assalam o alaikum! Tell me what you need in English, Roman Urdu or Urdu. For example "biryani for 6 people", "hafte ka sauda 4 logon ke liye, budget 8000", or just "doodh aur anday".</div>
    </div>
    <div class="chips" id="chips">
      <button class="chip" type="button">Chicken biryani for 6 people</button>
      <button class="chip" type="button">hafte ka nashta 2 logon ke liye</button>
      <button class="chip" type="button">doodh, anday aur double roti</button>
      <button class="chip" type="button">صفائی کا سامان چاہیے</button>
    </div>
    <form id="composer">
      <input id="input" type="text" autocomplete="off" maxlength="1000" placeholder="Kya chahiye? What do you need?" aria-label="Message" dir="auto">
      <button id="send" type="submit">Send</button>
    </form>
  </div>
  <aside id="basket" aria-label="Basket">
    <h2>Your basket <button id="closeBasket" type="button" aria-label="Close basket">×</button></h2>
    <div id="basketLines"><div class="empty">Your basket is empty</div></div>
    <div id="basketFoot"></div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const STORE_KEY = params.get("store") || "demo-store-key";
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let sessionId = store.get("sauda-session:" + STORE_KEY);
let basket = { revision: 0, items: [], total: 0, currency: "PKR", problems: [] };
let busy = false;
const qtyViews = new Map();   // product_id -> redraw functions for every card showing it

const rs = (n) => "Rs " + Number(n).toLocaleString("en-PK", { maximumFractionDigits: 2 });
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-Store-Key": STORE_KEY, ...(opts.headers || {}) } });
const scroll = () => { $("log").scrollTop = $("log").scrollHeight; };
function toast(msg) { const t = el("div", "toast", msg); document.body.append(t); setTimeout(() => t.remove(), 2600); }
function add(node) { $("log").append(node); scroll(); return node; }
function bubble(cls, text) { const b = el("div", "msg " + cls, text); b.dir = "auto"; return add(b); }

// ---------------------------------------------------------------- pictures
function hue(s) { let h = 0; for (const c of s || "") h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function placeholder(name) {
  const d = el("div", "ph"); const h = hue(name);
  d.style.background = `hsl(${h} 42% 90%)`; d.style.color = `hsl(${h} 45% 30%)`;
  d.textContent = (name || "?").split(/\s+/).filter(w => /[\p{L}\p{N}]/u.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join("");
  return d;
}
function picture(item, cls) {
  const box = el("div", cls);
  if (item.image) {
    const img = new Image(); img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
    img.onerror = () => img.replaceWith(placeholder(item.name)); img.src = item.image; box.append(img);
  } else box.append(placeholder(item.name));
  return box;
}

// ---------------------------------------------------------------- basket (server is the source of truth)
function key() { return (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, "").slice(0, 32); }
async function changeBasket(ops) {
  if (!sessionId) { sessionId = key(); store.set("sauda-session:" + STORE_KEY, sessionId); }
  const res = await api(`/api/basket/${sessionId}`, { method: "POST", body: JSON.stringify({ ops, expected_revision: basket.revision, idempotency_key: key() }) });
  const data = await res.json().catch(() => ({}));
  if (res.status === 409 && data.basket) { renderBasket(data.basket); toast("Your basket changed elsewhere. It's up to date now; tap again if needed."); return; }
  if (!res.ok) { toast(data.detail || data.error || "Couldn't update the basket."); return; }
  if (data.errors && data.errors.length) toast(data.errors[0]);
  renderBasket(data.basket);
}
const qtyIn = (pid) => (basket.items.find(i => i.product_id === pid && !i.issue) || {}).quantity || 0;

function stepper(pid, needId, suggested, track = true) {
  const box = el("div");
  const draw = () => {
    const q = qtyIn(pid); box.replaceChildren();
    if (!q) {
      const b = el("button", "add", suggested && suggested > 1 ? `Add ${suggested}` : "Add"); b.type = "button";
      b.onclick = () => changeBasket([{ op: "add", product_id: pid, quantity: suggested || 1, need_id: needId || "" }]);
      box.append(b);
    } else {
      const s = el("div", "stepper");
      const minus = el("button", "", "−"); minus.type = "button"; minus.setAttribute("aria-label", "One less");
      const plus = el("button", "", "+"); plus.type = "button"; plus.setAttribute("aria-label", "One more");
      minus.onclick = () => changeBasket([{ op: "set", product_id: pid, quantity: q - 1 }]);
      plus.onclick = () => changeBasket([{ op: "set", product_id: pid, quantity: q + 1, need_id: needId || "" }]);
      s.append(minus, el("span", "", String(q)), plus); box.append(s);
    }
  };
  draw();
  if (track) {  // cards in the chat stay; the basket panel is rebuilt on every change
    if (!qtyViews.has(pid)) qtyViews.set(pid, new Set());
    qtyViews.get(pid).add(draw);
  }
  return box;
}

function renderBasket(b) {
  if (!b) return;
  basket = b;
  $("basketCount").textContent = b.item_count;
  const lines = $("basketLines"); lines.replaceChildren();
  if (!b.items.length && !b.problems.length) lines.append(el("div", "empty", "Your basket is empty"));
  const list = el("div", "lines");
  for (const i of b.items) {
    const row = el("div", "line");
    const what = el("div", "what");
    what.append(el("div", "name", i.name), el("div", "meta", [i.size, rs(i.unit_price)].filter(Boolean).join(" · ")));
    if (i.issue) what.append(el("div", "sub", i.issue));
    what.append(stepper(i.product_id, i.need_id, 0, false));
    row.append(picture(i, "mini"), what, el("div", "amt", i.issue ? "—" : rs(i.line_total)));
    list.append(row);
  }
  for (const p of b.problems.filter(p => !b.items.some(i => i.product_id === p.product_id))) {
    const row = el("div", "line"); row.append(placeholder(p.name || "?"), el("div", "what sub", `${p.name || p.product_id}: ${p.issue}`), el("div"));
    list.append(row);
  }
  lines.append(list);
  const foot = $("basketFoot"); foot.replaceChildren();
  const t = el("div", "total"); t.append(el("span", "", `Total · ${b.item_count} item${b.item_count === 1 ? "" : "s"}`), el("span", "", rs(b.total)));
  foot.append(t, el("div", "meta", "Checkout is not enabled in this demo."));
  for (const fns of qtyViews.values()) fns.forEach(fn => fn());
}

// ---------------------------------------------------------------- cards
function productCard(o, needId) {
  const card = el("div", "card" + (o.chosen ? " chosen" : ""));
  if (o.ref) card.append(el("span", "ref", String(o.ref)));
  if (o.substitute) card.append(el("span", "badge", "Substitute"));
  card.append(picture(o, "thumb"));
  const body = el("div", "body");
  body.append(el("div", "name", o.name), el("div", "meta", [o.brand, o.size].filter(Boolean).join(" · ")));
  body.append(el("div", "price", rs(o.price)));
  if (o.unit_price) body.append(el("div", "meta", o.unit_price.replace(/^Rs /, "≈ Rs ")));
  if (o.low_stock) body.append(el("div", "low", `Only ${o.low_stock} left`));
  body.append(stepper(o.product_id, needId || o.need_id, o.suggested_packs));
  card.append(body);
  return card;
}

function renderCards(cards) {
  for (const c of cards || []) {
    const block = el("div", "block");
    if (c.type === "options") {
      for (const g of c.groups) {
        block.append(el("h3", "", g.label));
        const row = el("div", "row"); g.options.forEach(o => row.append(productCard(o, g.need_id))); block.append(row);
      }
    } else if (c.type === "plan") {
      const p = el("div", "panel");
      p.append(el("h3", "", "Suggested list"));
      const list = el("div", "lines");
      for (const l of c.lines) {
        const row = el("div", "line");
        const what = el("div", "what");
        what.append(el("div", "name", l.name), el("div", "meta", `${l.packs} × ${rs(l.unit_price)}${l.size ? " · " + l.size : ""} · for ${l.need}`));
        if (l.substitute) what.append(el("div", "sub", "Substitute"));
        row.append(picture(l, "mini"), what, el("div", "amt", rs(l.line_total)));
        list.append(row);
      }
      p.append(list);
      const t = el("div", "total"); t.append(el("span", "", "Total"), el("span", "", rs(c.total))); p.append(t);
      for (const b of c.budgets || []) {
        const box = el("div", "budget");
        const bar = el("div", "bar" + (b.over ? " over" : "")); const fill = el("i"); fill.style.width = Math.min(100, b.planned / b.budget * 100) + "%"; bar.append(fill);
        box.append(el("span", "", `Budget (${b.scope}): ${rs(b.planned)} of ${rs(b.budget)} · ${b.over ? rs(-b.remaining) + " over" : rs(b.remaining) + " left"}`), bar);
        p.append(box);
      }
      if (c.missing && c.missing.length) p.append(el("div", "missing", "Not available: " + c.missing.map(m => m.label).join(", ")));
      const allIn = c.lines.every(l => qtyIn(l.product_id) >= l.packs);
      const btn = el("button", "wide", allIn ? "All in basket" : "Add all to basket"); btn.type = "button"; btn.disabled = allIn;
      btn.onclick = async () => { btn.disabled = true; await changeBasket(c.lines.map(l => ({ op: "set", product_id: l.product_id, quantity: Math.max(l.packs, qtyIn(l.product_id)), need_id: l.need_id }))); btn.textContent = "All in basket"; };
      p.append(btn);
      block.append(p);
    } else if (c.type === "comparison") {
      block.append(el("h3", "", "Comparison"));
      const wrap = el("div", "table-wrap"); const table = el("table");
      const head = el("tr"); ["", "Product", "Size", "Price", "Per unit", ""].forEach(h => head.append(el("th", "", h))); table.append(head);
      for (const i of c.items) {
        const tr = el("tr");
        tr.append(el("td", "", String(i.ref)), el("td", "", i.name + (i.in_stock ? "" : " (out of stock)")), el("td", "", i.size || "—"),
                  el("td", "num", rs(i.price)), el("td", "num", i.unit_price || "—"));
        const td = el("td"); if (i.in_stock) td.append(stepper(i.product_id, "")); tr.append(td); table.append(tr);
      }
      wrap.append(table); block.append(wrap);
    } else if (c.type === "basket") {
      renderBasket(c.basket);
      continue;
    }
    add(block);
  }
}

// ---------------------------------------------------------------- chat (server-sent events)
async function send(text) {
  text = text.trim(); if (!text || busy) return;
  busy = true; $("send").disabled = true; $("chips").hidden = true;
  bubble("user", text); $("input").value = "";
  const status = add(el("div", "status", "Thinking"));
  try {
    const res = await api("/api/chat/stream", { method: "POST", body: JSON.stringify({ message: text, session_id: sessionId }) });
    if (!res.ok || !res.body) { const d = await res.json().catch(() => ({})); throw new Error(d.detail || d.error || "The assistant is unavailable."); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (chunk.match(/^event: (.*)$/m) || [])[1]; const data = JSON.parse((chunk.match(/^data: (.*)$/m) || [, "{}"])[1]);
        if (ev === "session") { sessionId = data.session_id; store.set("sauda-session:" + STORE_KEY, sessionId); }
        else if (ev === "status") status.textContent = data.text;
        else if (ev === "result") { status.remove(); bubble("bot", data.reply); renderCards(data.cards); renderBasket(data.basket); }
        else if (ev === "error") throw new Error(data.message);
      }
    }
  } catch (e) {
    status.remove(); add(el("div", "error", e.message || "Something went wrong. Please try again."));
  } finally { busy = false; $("send").disabled = false; $("input").focus(); }
}

$("composer").addEventListener("submit", (e) => { e.preventDefault(); send($("input").value); });
$("chips").addEventListener("click", (e) => { if (e.target.classList.contains("chip")) send(e.target.textContent); });
$("basketBtn").onclick = () => $("basket").classList.add("open");
$("closeBasket").onclick = () => $("basket").classList.remove("open");

api("/api/store").then(r => r.ok ? r.json() : Promise.reject()).then(s => {
  $("store").textContent = `${s.name} · ${s.catalog.published_products} products`;
}).catch(() => { $("store").textContent = "Store unavailable"; });
if (sessionId) {
  api(`/api/basket/${sessionId}`).then(r => r.ok ? r.json() : null).then(renderBasket);
  api(`/api/session/${sessionId}`).then(r => r.ok ? r.json() : null).then(s => {
    if (!s || !s.messages.length) return;
    $("chips").hidden = true;
    for (const m of s.messages) bubble(m.role === "user" ? "user" : "bot", m.content);
  });
}
</script>
</body>
</html>
