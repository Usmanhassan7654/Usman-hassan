<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Shopping Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f4f6f8; --panel: #ffffff; --ink: #111827; --muted: #6b7280; --line: #e5e7eb;
  --brand: #0f766e; --brand-ink: #ffffff; --brand-soft: #e6f4f1; --accent: #f59e0b; --bad: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1117; --panel: #161b22; --ink: #e6edf3; --muted: #9aa4b2; --line: #2a313c;
          --brand: #2dd4bf; --brand-ink: #062a26; --brand-soft: #12302c; --accent: #fbbf24; --bad: #f87171; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
button { font: inherit; cursor: pointer; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: minmax(0, 1fr); height: 100%; }
@media (max-width: 900px) { .app { grid-template-columns: 1fr; } aside { display: none; } aside.open { display: flex; position: fixed; inset: 0; z-index: 5; } }
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font: 800 15px Manrope, sans-serif; }
header h1 { font: 800 17px Manrope, sans-serif; margin: 0; }
header small { color: var(--muted); display: block; font-size: 12px; }
.live { margin-left: auto; font-size: 12px; color: var(--brand); display: flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
#cartBtn { display: none; margin-left: 8px; border: 1px solid var(--brand); background: transparent; color: var(--brand); border-radius: 999px; padding: 5px 12px; font-weight: 600; }
@media (max-width: 900px) { #cartBtn { display: block; } }
#log { flex: 1; overflow-y: auto; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: min(640px, 86%); padding: 11px 15px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.user { align-self: flex-end; background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; }
.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.typing { align-self: flex-start; color: var(--muted); font-size: 13px; }
.err { align-self: flex-start; color: var(--bad); border: 1px solid var(--bad); border-radius: 10px; padding: 8px 12px; font-size: 14px; max-width: 86%; }
.block { align-self: stretch; max-width: 780px; display: flex; flex-direction: column; gap: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.card img { width: 100%; aspect-ratio: 5/6; object-fit: contain; background: #fff; display: block; }
.card .b { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.name { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.meta { color: var(--muted); font-size: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 10.5px; background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 1px 7px; }
.price { font: 800 15px Manrope, sans-serif; margin-top: auto; padding-top: 4px; }
.add { margin-top: 6px; border: 0; border-radius: 9px; background: var(--brand); color: var(--brand-ink); padding: 7px; font-weight: 600; }
.add.in { background: var(--brand-soft); color: var(--brand); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { margin: 0; font: 800 15px Manrope, sans-serif; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.row img { width: 40px; height: 48px; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid var(--line); }
.amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.total { display: flex; justify-content: space-between; font: 800 16px Manrope, sans-serif; border-top: 1px dashed var(--line); padding-top: 10px; }
.note { font-size: 13px; color: var(--muted); }
.ok { color: var(--brand); font-weight: 600; }
.big { border: 0; border-radius: 11px; background: var(--brand); color: var(--brand-ink); padding: 11px 16px; font-weight: 700; }
.big:disabled { opacity: .55; cursor: default; }
input, select { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 12px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 7px 13px; font-size: 13px; }
.chip:hover { border-color: var(--brand); }
form#composer { display: flex; gap: 10px; padding: 12px 20px 16px; background: var(--panel); border-top: 1px solid var(--line); }
#input { flex: 1; padding: 12px 14px; border-radius: 12px; }
#send { border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink); padding: 0 20px; font-weight: 700; }
aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
aside h2 { margin: 0; padding: 16px 18px; font: 800 16px Manrope, sans-serif; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
#cartLines { flex: 1; overflow-y: auto; padding: 12px 18px; display: flex; flex-direction: column; gap: 10px; }
.qty { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; }
.qty button { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
#cartFoot { padding: 14px 18px 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.empty { color: var(--muted); text-align: center; padding: 40px 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <main>
    <header>
      <div class="logo">AI</div>
      <div><h1>AI Shopping Assistant</h1><small id="info">Loading store…</small></div>
      <span class="live">Live</span>
      <button id="cartBtn" type="button">Cart · <span id="cartCount">0</span></button>
    </header>
    <div id="log" aria-live="polite">
      <div class="msg bot">Hi! Tell me what you need. I can build a cart within your budget, get everything for a recipe, find products like "gluten-free snacks under $10", and check you out right here.</div>
    </div>
    <div class="chips" id="chips">
      <button class="chip" type="button">I have $50. Suggest groceries for the week.</button>
      <button class="chip" type="button">What ingredients do I need for lasagna?</button>
      <button class="chip" type="button">Show me gluten-free snacks under $10.</button>
      <button class="chip" type="button">I want to cook chicken pasta for four people. What should I buy?</button>
    </div>
    <form id="composer">
      <input id="input" autocomplete="off" maxlength="1000" placeholder="Type a recipe, budget, dietary filter or question…">
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <aside id="cartPanel">
    <h2>Your cart <button id="closeCart" type="button" style="border:0;background:none;color:var(--muted);font-size:20px">×</button></h2>
    <div id="cartLines"><div class="empty">Your cart is empty</div></div>
    <div id="cartFoot"></div>
  </aside>
</div>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const money = (n) => "$" + Number(n).toFixed(2);
let sid = null; try { sid = localStorage.getItem("shop-sid"); } catch {}
if (!sid) { sid = Math.random().toString(36).slice(2) + Date.now().toString(36); try { localStorage.setItem("shop-sid", sid); } catch {} }
let cart = { items: [], count: 0, total: 0 };
const addButtons = [];

function scroll() { $("log").scrollTop = $("log").scrollHeight; }
function say(cls, text) { const m = el("div", "msg " + cls, text); $("log").append(m); scroll(); return m; }
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || "Something went wrong.");
  return data;
}

// ---------- cart
async function changeCart(items, mode = "add") {
  try { renderCart(await api("/api/cart", { session_id: sid, items, mode })); }
  catch (e) { say("err", e.message); }
}
function inCart(id) { return (cart.items.find(i => i.id === id) || {}).quantity || 0; }
function renderCart(c) {
  cart = c; $("cartCount").textContent = c.count;
  const box = $("cartLines"); box.replaceChildren();
  if (!c.items.length) box.append(el("div", "empty", "Your cart is empty"));
  for (const i of c.items) {
    const row = el("div", "row"); const img = el("img"); img.src = i.image; img.alt = "";
    const mid = el("div"); mid.append(el("div", "name", i.name), el("div", "meta", `${i.size} · ${money(i.price)}`));
    const q = el("div", "qty"); const minus = el("button", "", "−"); const plus = el("button", "", "+");
    minus.onclick = () => changeCart([{ product_id: i.id, quantity: i.quantity - 1 }], "set");
    plus.onclick = () => changeCart([{ product_id: i.id, quantity: i.quantity + 1 }], "set");
    q.append(minus, el("span", "", String(i.quantity)), plus); mid.append(q);
    row.append(img, mid, el("div", "amt", money(i.line_total))); box.append(row);
  }
  const foot = $("cartFoot"); foot.replaceChildren();
  const t = el("div", "total"); t.append(el("span", "", `Total (${c.count} items)`), el("span", "", money(c.total)));
  const go = el("button", "big", "Checkout"); go.disabled = !c.items.length; go.onclick = () => showCheckout();
  foot.append(t, go);
  addButtons.forEach(fn => fn());
}

// ---------- cards
function productCard(p) {
  const c = el("div", "card"); const img = el("img"); img.src = p.image; img.alt = p.name; c.append(img);
  const b = el("div", "b"); b.append(el("div", "name", p.name), el("div", "meta", `${p.brand} · ${p.size} · ★ ${p.rating}`));
  const tags = el("div", "tags"); (p.dietary || []).slice(0, 3).forEach(t => tags.append(el("span", "tag", t))); b.append(tags);
  b.append(el("div", "price", money(p.price)));
  const btn = el("button", "add"); btn.type = "button";
  const draw = () => { const q = inCart(p.id); btn.textContent = q ? `In cart (${q}) · add 1` : "Add to cart"; btn.classList.toggle("in", !!q); };
  btn.onclick = () => changeCart([{ product_id: p.id, quantity: 1 }]); draw(); addButtons.push(draw);
  b.append(btn); c.append(b); return c;
}
function bundle(card) {
  const p = el("div", "panel"); p.append(el("h3", "", card.title));
  for (const i of card.items) {
    const row = el("div", "row"); const img = el("img"); img.src = i.image; img.alt = "";
    const mid = el("div"); mid.append(el("div", "name", i.name), el("div", "meta", `${i.quantity} × ${money(i.price)} · ${i.size}${i.for ? " · for " + i.for : ""}`));
    row.append(img, mid, el("div", "amt", money(i.line_total))); p.append(row);
  }
  const t = el("div", "total"); t.append(el("span", "", "Total"), el("span", "", money(card.total))); p.append(t);
  if (card.kind === "budget") p.append(el("div", card.remaining >= 0 ? "note ok" : "note", `✓ ${money(card.remaining)} under your ${money(card.budget)} budget`));
  if (card.already_have && card.already_have.length) p.append(el("div", "note", "Skipped (you have them): " + card.already_have.join(", ")));
  if (card.missing && card.missing.length) p.append(el("div", "note", "Not in the store: " + card.missing.join(", ")));
  const btn = el("button", "big", `Add all to cart (${money(card.total)})`); btn.type = "button";
  btn.onclick = async () => { btn.disabled = true; await changeCart(card.items.map(i => ({ product_id: i.id, quantity: i.quantity }))); btn.textContent = "Added to cart ✓"; };
  p.append(btn); return p;
}
function showCheckout() {
  if (!cart.items.length) return;
  $("cartPanel").classList.remove("open");
  const p = el("div", "panel"); p.append(el("h3", "", "Checkout"));
  for (const i of cart.items) { const r = el("div", "row"); const img = el("img"); img.src = i.image; img.alt = ""; r.append(img, el("div", "name", `${i.quantity} × ${i.name}`), el("div", "amt", money(i.line_total))); p.append(r); }
  const t = el("div", "total"); t.append(el("span", "", "Total payable"), el("span", "", money(cart.total))); p.append(t);
  const name = el("input"); name.placeholder = "Full name"; const addr = el("input"); addr.placeholder = "Delivery address";
  const pay = el("select"); [["card", "Card (demo)"], ["apple_pay", "Apple Pay (demo)"], ["cash", "Cash on delivery"]].forEach(([v, l]) => { const o = el("option", "", l); o.value = v; pay.append(o); });
  const btn = el("button", "big", `Pay ${money(cart.total)}`); btn.type = "button";
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      const r = await api("/api/checkout", { session_id: sid, name: name.value, address: addr.value, payment: pay.value });
      p.replaceChildren(el("h3", "", "Order confirmed ✓"), el("div", "", `Order ${r.order.order_id} · ${money(r.order.total)} · delivery in about ${r.order.eta}.`),
                        el("div", "note", "Demo order: no real payment was taken."));
      renderCart(r.cart);
    } catch (e) { btn.disabled = false; say("err", e.message); }
  };
  p.append(name, addr, pay, btn, el("div", "note", "Demo checkout: no real payment is taken."));
  const block = el("div", "block"); block.append(p); $("log").append(block); scroll();
}
function render(cards) {
  for (const c of cards || []) {
    if (c.type === "products") { const g = el("div", "grid"); c.items.forEach(p => g.append(productCard(p))); const b = el("div", "block"); b.append(g); $("log").append(b); }
    else if (c.type === "bundle") { const b = el("div", "block"); b.append(bundle(c)); $("log").append(b); }
    else if (c.type === "checkout") showCheckout();
  }
  scroll();
}

// ---------- chat
async function send(text) {
  text = text.trim(); if (!text) return;
  $("chips").hidden = true; $("send").disabled = true; $("input").value = "";
  say("user", text); const typing = el("div", "typing", "Assistant is thinking…"); $("log").append(typing); scroll();
  try {
    const r = await api("/api/chat", { session_id: sid, message: text });
    typing.remove(); say("bot", r.reply); render(r.cards); renderCart(r.cart);
  } catch (e) { typing.remove(); say("err", e.message); }
  $("send").disabled = false; $("input").focus();
}
$("composer").onsubmit = (e) => { e.preventDefault(); send($("input").value); };
$("chips").onclick = (e) => { if (e.target.classList.contains("chip")) send(e.target.textContent); };
$("cartBtn").onclick = () => $("cartPanel").classList.add("open");
$("closeCart").onclick = () => $("cartPanel").classList.remove("open");
api("/api/info").then(i => { $("info").textContent = `${i.products} products · vector search${i.ai_ready ? "" : " · add your Groq key to .env"}`; }).catch(() => {});
api("/api/cart/" + sid).then(renderCart).catch(() => {});
</script>
</body>
</html>
